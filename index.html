<style>
:root{
  --bg:#0E0E0F; --c1:#18181A; --c2:#232326; --c3:#2F2F34; --line:#2C2C31; --tx:#F4F4F5; --mu:#A1A1A8; --dim:#6E6E75;
  --btn:#F4F4F5; --on-btn:#0E0E0F; --green:#4ADE80; --green-bg:#12301F; --green-tx:#9FE5B6; --amber:#FBBF77; --amber-bg:#35271A;
  --sans:'Onest',-apple-system,'SF Pro Text',system-ui,'Segoe UI',sans-serif;
  --serif:var(--sans);
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.5,0,.75,0);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E0E0F; --tx:#F4F4F5; } }
:root[data-theme="dark"]{ --bg:#0E0E0F; --tx:#F4F4F5; }
html{ height:100%; background:var(--bg); scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ height:100%; margin:0; background:var(--bg); color:var(--tx); font:15px/1.45 var(--sans); -webkit-font-smoothing:antialiased; overflow:hidden; -webkit-tap-highlight-color:transparent; }
button,input,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; background:none; border:0; padding:0; }
:focus-visible{ outline:2px solid var(--tx); outline-offset:2px; }
.tnum{ font-variant-numeric:tabular-nums; }
.ic{ flex:none; display:block; }

/* ── motion ── */
@keyframes up{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
@keyframes fade{ from{ opacity:0; } to{ opacity:1; } }
@keyframes fadeOut{ to{ opacity:0; } }
@keyframes inR{ from{ opacity:0; transform:translateX(48px); } to{ opacity:1; transform:none; } }
@keyframes inL{ from{ opacity:0; transform:translateX(-48px); } to{ opacity:1; transform:none; } }
@keyframes rise{ from{ opacity:0; transform:translateY(10px) scale(.985); } to{ opacity:1; transform:none; } }
@keyframes sheetUp{ from{ transform:translateY(100%); } to{ transform:none; } }
@keyframes sheetDown{ to{ transform:translateY(100%); } }
@keyframes zoomIn{ from{ opacity:0; transform:scale(.94) translateY(12px); } to{ opacity:1; transform:none; } }
@keyframes zoomOut{ to{ opacity:0; transform:scale(.96) translateY(8px); } }
@keyframes pop{ 0%{ transform:scale(.6); } 60%{ transform:scale(1.14); } 100%{ transform:scale(1); } }
@keyframes bump{ 0%{ transform:scale(1); } 40%{ transform:scale(1.12); } 100%{ transform:scale(1); } }
@keyframes glow{ 0%{ box-shadow:inset 0 0 0 1.5px var(--green); background-color:#16271D; } 100%{ box-shadow:inset 0 0 0 1.5px transparent; } }
@keyframes growY{ from{ transform:scaleY(0); } to{ transform:scaleY(1); } }
@keyframes growX{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
@keyframes drop{ from{ opacity:0; transform:translate(-50%,-20px) scale(.96); } to{ opacity:1; transform:translate(-50%,0); } }
@keyframes float{ from{ opacity:0; transform:translateY(30px) rotate(var(--r,0deg)) scale(.96); } to{ opacity:1; transform:translateY(0) rotate(var(--r,0deg)); } }
@keyframes bob{ 0%,100%{ transform:translateY(0) rotate(var(--r,0deg)); } 50%{ transform:translateY(-7px) rotate(var(--r,0deg)); } }
@keyframes shine{ from{ transform:translateX(-130%) skewX(-18deg); } to{ transform:translateX(330%) skewX(-18deg); } }
@keyframes letter{ from{ opacity:0; transform:translateY(.35em); filter:blur(8px); } to{ opacity:1; transform:none; filter:blur(0); } }
@keyframes spinIn{ from{ transform:rotate(-200deg) scale(.4); opacity:0; } to{ transform:none; opacity:1; } }
@keyframes breathe{ 0%,100%{ opacity:.35; transform:scale(1); } 50%{ opacity:.6; transform:scale(1.08); } }
@keyframes out{ to{ opacity:0; transform:translateX(24px) scale(.97); } }
@keyframes flash{ from{ opacity:.35; } to{ opacity:1; } }
@keyframes dash{ to{ stroke-dashoffset:0; } }
@keyframes ring{ from{ transform:scale(.4); opacity:.9; } to{ transform:scale(2.2); opacity:0; } }

.enter .stag{ animation:up .55s var(--ease) both; animation-delay:calc(var(--i,0) * 60ms + 60ms); }
.enter.fwd > .wrap{ animation:inR .42s var(--ease) both; }
.enter.bwd > .wrap{ animation:inL .42s var(--ease) both; }
.enter.swap > .wrap{ animation:fade .35s var(--ease) both; }
.new{ animation:rise .45s var(--ease) both; animation-delay:calc(var(--i,0) * 70ms); }
.out{ animation:out .22s var(--out) forwards; pointer-events:none; }
.bump{ animation:bump .32s var(--spring); }
.pop{ animation:pop .42s var(--spring) both; }
.glow{ animation:glow 1.6s var(--ease); }
.flash{ animation:flash .35s var(--ease); }
.press{ transition:transform .16s var(--ease), background-color .2s, opacity .2s, color .2s; }
.press:active{ transform:scale(.97); }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation-duration:.001ms !important; animation-delay:0ms !important; transition-duration:.001ms !important; } }

/* ── layout ── */
.app{ height:100%; display:grid; grid-template-columns:1fr; }
.side{ display:none; }
.view{ height:100%; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
.wrap{ max-width:1180px; margin:0 auto; padding:14px 18px 130px; }
.mtop{ display:flex; align-items:center; gap:10px; height:48px; margin-bottom:8px; }
.mtop .brand{ margin-right:auto; }
.brand{ display:flex; align-items:center; gap:9px; font-weight:600; font-size:17px; letter-spacing:-.01em; }
.brand svg{ width:26px; height:26px; }
.avatar{ width:36px; height:36px; border-radius:50%; background:var(--c2); display:grid; place-items:center; font-size:13px; font-weight:600; color:var(--tx); }
.tabbar{ position:fixed; left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom,0px)); height:64px; z-index:20; background:rgba(28,28,31,.82); -webkit-backdrop-filter:blur(22px) saturate(1.4); backdrop-filter:blur(22px) saturate(1.4); border:1px solid rgba(255,255,255,.07); border-radius:24px; display:flex; padding:6px; }
.tabbar .thumb{ transition:transform .45s var(--spring), opacity .25s; position:absolute; top:6px; bottom:6px; left:6px; width:calc((100% - 12px) / 3); background:rgba(255,255,255,.08); border-radius:18px; transition:transform .45s var(--spring); }
.tab{ flex:1; position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; font-weight:500; color:var(--dim); transition:color .25s; }
.tab.on{ color:var(--tx); }
.tab.on .ic{ animation:pop .4s var(--spring); }
@media (min-width:900px){
  .app{ grid-template-columns:260px 1fr; }
  .side{ display:flex; flex-direction:column; gap:4px; padding:22px 14px 18px; border-right:1px solid var(--line); background:#111113; }
  .side .brand{ padding:4px 10px 24px; }
  .nav{ position:relative; display:flex; flex-direction:column; gap:2px; }
  .nav .thumb{ position:absolute; left:0; right:0; top:0; height:44px; background:var(--c2); border-radius:12px; transition:transform .45s var(--spring), opacity .25s; }
  .nav button{ position:relative; z-index:1; height:44px; display:flex; align-items:center; gap:12px; padding:0 12px; border-radius:12px; color:var(--mu); font-weight:500; text-align:left; transition:color .2s; }
  .nav button:hover{ color:var(--tx); }
  .nav button.on{ color:var(--tx); }
  .side .foot{ margin-top:auto; display:grid; gap:12px; }
  .me{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:14px; text-align:left; transition:background .2s; }
  .me:hover,.me.on{ background:var(--c1); }
  .me .avatar{ flex:none; overflow:hidden; } .me b{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .me b{ display:block; font-weight:600; font-size:14px; } .me span{ font-size:12.5px; color:var(--dim); }
  .tabbar,.mtop{ display:none; }
  .wrap{ padding:40px 48px 64px; }
}

/* ── primitives ── */

<script>
(function(){
  var d=document.documentElement;
  var sa=false; try{ sa=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches; }catch(e){}
  if(!sa) return;
  d.classList.add('standalone');
  function fit(){
    var land=window.innerWidth>window.innerHeight;
    var full=land?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);
    d.style.setProperty('--app-h',Math.max(window.innerHeight,full)+'px');
  }
  fit(); window.addEventListener('resize',fit); window.addEventListener('orientationchange',function(){ setTimeout(fit,250); });
})();

const NOUNS={card:/business ?card|визитк|visitenkarte/i, banner:/banner|баннер/i, poster:/poster|постер|плакат|plakat/i, flyer:/flyer|flier|флаер|листовк/i,

  site:/website|landing|сайт|лендинг|webseite/i, page:/\bpage|\bscreen|страниц|экран|\bseite/i, menu:/menu|меню|speisekarte/i, social:/\bpost\b|stories|story|сторис|\bпост/i, logo:/logo|логотип|лого/i};
const NOUN_MIN={card:180,banner:120,poster:240,flyer:180,letterhead:120,packaging:360,deck:240,site:480,page:180,menu:240,social:60,logo:480};
const RULES=[
  ['text',15,/typo|spelling|wording|\bcopy\b|\btext|headline|title|phone|address|опечат|текст|надпис|слово|заголов|телефон|адрес|tippfehler|überschrift|telefon|adresse/i],
  ['size',15,/bigger|smaller|larger|\bsize|scale|больше|меньше|крупн|мельч|размер|увелич|уменьш|größer|kleiner|größe/i],
  ['color',20,/colou?r|darker|lighter|brighter|warmer|cooler|background|contrast|цвет|темн|светл|ярч|ярк|фон|контраст|оттен|тепле|холодн|farbe|dunkler|heller|wärmer|hintergrund|kontrast/i],
  ['position',20,/\bmove|align|spacing|margin|padding|center|centre|closer|сдвин|подвин|придвин|перемест|выровн|отступ|по центру|левее|правее|ближе|verschieb|ausricht|abstand|zentr/i],
  ['type',30,/font|typeface|\bbold|italic|weight|kerning|шрифт|жирн|курсив|начертан|кернинг|schrift|fett|kursiv/i],
  ['image',30,/photo|image|picture|\bicon|фото|картин|изображ|иконк|снимок|\bbild|\bfoto/i],
  ['layout',60,/layout|composition|rearrange|reorder|section|\bblock|\bgrid|structure|hierarchy|компоновк|композиц|переставить|порядок|блок|раздел|секци|сетк|структур|иерарх|aufbau|anordnung|abschnitt|raster/i],
  ['rework',120,/\bredo|rework|redesign|from scratch|another (option|version|variant)|alternative|different (style|direction)|переделать|переделай|перерисов|заново|с нуля|другой вариант|ещё вариант|еще вариант|другой стиль|überarbeit|neu gestalten|variante|von vorne/i],
  ['craft',180,/animat|motion|video|\bgif|illustrat|иллюстрац|анимац|видео|illustration/i]
];
const ADD_RE=/\badd\b|\bnew\b|\banother\b|\bextra\b|\bcreate\b|\balso (a|an)\b|добав|нов[аоуыйе]|ещё|еще|созда|сделать также|hinzu|\bneue?[nrs]?\b|zusätzlich|auch (ein|eine)\b/i;
function nounOf(s){ for(const k in NOUNS){ if(NOUNS[k].test(s)) return k; } return null; }
function suggest(text){
  const s=String(text||''); let k='general', m=30, noun=null;
  const n=nounOf(s);
  if(ADD_RE.test(s) && n && n!=='logo' && !/bigger|smaller|крупн|больше|меньше|größer/i.test(s)){ k='new'; m=NOUN_MIN[n]||180; noun=n; }
  else{ let best=null; RULES.forEach(r=>{ if(r[2].test(s) && (!best || r[1]>best[1])) best=r; }); if(best){ k=best[0]; m=best[1]; } }
  if(k!=='new'){
    if(/\ball\b|\bevery|everywhere|whole|throughout|все[хм]?(\s|$|,)|всё|везде|весь|целиком|\balle[nms]?\b|überall|gesamt/i.test(s)) m*=2;
    if(/slightly|a bit|a little|tiny|чуть|немного|слегка|etwas|ein bisschen|leicht/i.test(s)) m*=.75;
  }
  m=Math.max(15,Math.round(m/15)*15);
  return {k:k,m:m,noun:noun||n};
}
const STEPS=[15,30,45,60,90,120,150,180,240,300,360,480,600,720,960,1200];
function stepMins(cur,d){ if(d>0){ for(const s of STEPS) if(s>cur) return s; return cur+240; } for(let i=STEPS.length-1;i>=0;i--) if(STEPS[i]<cur) return STEPS[i]; return 15; }
function classify(p,round,sug){

  return {extra:false,reason:'included'};
}
function splitLines(txt){
  return String(txt||'').split(/\n+|;\s+/).map(l=>l.replace(/^\s*(?:[-–•*·]|\d+[.)])\s*/,'').trim())

function countUp(el,to,fmt,from){
  if(!el) return; const f=fmt==='money'?money:(fmt==='int'?(v=>String(Math.round(v))):fmt);
  const start=from!=null?from:(el._v!=null?el._v:0); el._v=to;
  if(reduced()||start===to){ el.textContent=f(to); return; }
  const t0=performance.now(), D=900; cancelAnimationFrame(el._raf);
  const step=now=>{ const k=Math.min(1,(now-t0)/D), e=1-Math.pow(1-k,4); const v=start+(to-start)*e; el.textContent=f(fmt==='money'?Math.round(v/100)*100:v); if(k<1) el._raf=requestAnimationFrame(step); else el.textContent=f(to); };
  el._raf=requestAnimationFrame(step);
}

  const items=[['home','home',t('nav_home')],['estimate','est',t('nav_est')],['projects','proj',t('nav_proj')],['activity','pulse',t('nav_act')]];
  const tabs=items.slice(0,3);
  $('#side').innerHTML=`<div class="brand">${mark()}<span>Rounds</span>${burger()}</div>
    <nav class="nav"><span class="thumb" style="transform:translateY(${Math.min(idx,3)*46}px);opacity:${idx>3?0:1}"></span>${items.map(i=>`<button class="${k===i[0]?'on':''}" data-act="go" data-to="${i[0]}">${ic(i[1])}<span>${esc(i[2])}</span></button>`).join('')}</nav>
    <div class="foot"><button class="me ${k==='account'?'on':''}" data-act="go" data-to="account">${avatarHTML()}<span style="min-width:0"><b>${esc(dispName()||t('you'))}</b><span id="sideSync">${esc(syncLine())}</span></span></button></div>`;
  $('#tabbar').innerHTML=`<span class="thumb" style="transform:translateX(${Math.min(idx,2)*100}%);opacity:${idx>2?0:1}"></span>${tabs.map(i=>`<button class="tab ${k===i[0]?'on':''}" data-act="go" data-to="${i[0]}">${ic(i[1],22)}<span>${esc(i[2])}</span></button>`).join('')}`;
  syncSegs($('#side'),true);
}
function moveNav(){
  const k=navKey(), idx=Math.max(0,ROUTES.indexOf(k));
  const nt=$('.nav .thumb'); if(nt){ nt.style.opacity=idx>3?0:1; if(idx<=3) nt.style.transform=`translateY(${idx*46}px)`; }
  const tt=$('#tabbar .thumb'); if(tt){ tt.style.opacity=idx>2?0:1; if(idx<=2) tt.style.transform=`translateX(${idx*100}%)`; }
  const me=$('.side .me'); if(me) me.classList.toggle('on',k==='account');
  $$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.to===k));
  $$('#tabbar .tab').forEach(b=>{ const on=b.dataset.to===k; if(on&&!b.classList.contains('on')){ b.classList.add('on'); } else if(!on) b.classList.remove('on'); });
}
const burger=()=>`<button class="burger press" data-act="menu" aria-label="${esc(t('menu_open'))}" aria-haspopup="dialog"><i></i><i></i><i></i></button>`;
const mtop=()=>`<div class="mtop"><div class="brand">${mark()}<span>Rounds</span></div>${burger()}</div>`;

/* ================= router ================= */
function go(route,opt){
  opt=opt||{};
  const prevIdx=ROUTES.indexOf(navKey());
  if(route==='project'){ S.from=S.route==='project'?S.from:S.route; S.pid=opt.pid; }
  S.route=route; save();
  let dir=opt.dir;
  if(!dir){ if(route==='project') dir='fwd'; else { const ni=ROUTES.indexOf(route); dir= opt.back?'bwd': (ni>=prevIdx?'fwd':'bwd'); } }
  moveNav(); renderView(dir);
}
function renderView(anim){
  const v=$('#view'); fresh.clear();
  const html=S.route==='estimate'?vEstimate():S.route==='projects'?vProjects():S.route==='project'?vProject():S.route==='activity'?vActivity():S.route==='account'?vAccount():vHome();
  v.classList.remove('enter','fwd','bwd','swap');
  v.innerHTML=`<div class="wrap">${html}</div>`;
  if(anim){ reflow(v); v.classList.add('enter'); if(typeof anim==='string') v.classList.add(anim); }
  v.scrollTop=0;
  syncSegs(v,true); runCounts(v);
  after(); updateEstbar(true);
}
function after(){ if(S.route==='estimate'){ const ta=$('#comp'); if(ta) autoGrow(ta); estSum(true); } }

      <div class="delta">${esc(delta)}</div>

    <button class="cta press stag" style="--i:${i++}" data-act="go" data-to="estimate">
      <b>${esc(t('cta_t'))}</b><p>${esc(t('cta_d'))}</p><span class="go">${ic('arrow',22)}</span>
    </button>
  </div>
  <div class="stats" style="margin-top:12px">
    <div class="stat stag" style="--i:${i++}"><span>${esc(t('st_active'))}</span><b class="tnum" data-count="${active}">${active}</b></div>
    <div class="stat stag" style="--i:${i++}"><span>${esc(t('st_wait'))}</span><b class="g tnum" data-count="${wait}" data-fmt="money">${esc(money(wait))}</b></div>

  const card=$('#sumCard'); if(!card) return;

  const pages=[['home','home',t('nav_home'),t('pg_home_d')],['estimate','est',t('nav_est'),t('pg_est_d')],['projects','proj',t('nav_proj'),t('pg_proj_d',{n:S.projects.length,a:act})],['activity','pulse',t('nav_act'),t('pg_act_d')],['account','user',t('nav_acc'),t('pg_acc_d')]];
  return `<div class="menu-in">
    <div class="menu-hd"><div class="brand">${mark()}<span>Rounds</span></div><button class="x press" data-act="menu-close" aria-label="${esc(t('close'))}">${ic('x',20)}</button></div>
    <nav class="mcards">${pages.map(p=>`<button class="mcard press mi ${k===p[0]?'on':''}" style="--i:${i++}" data-act="m-go" data-to="${p[0]}" ${k===p[0]?'aria-current="page"':''}><span class="mico">${ic(p[1],22)}</span><span class="mtx"><b>${esc(p[2])}</b><small>${esc(p[3])}</small></span>${ic('arrow',20)}</button>`).join('')}
      <button class="mcard press mi" style="--i:${i++}" data-act="m-tour"><span class="mico">${ic('help',22)}</span><span class="mtx"><b>${esc(t('tour_start'))}</b><small>${esc(t('pg_help_d'))}</small></span>${ic('arrow',20)}</button>
    </nav></div>`;
}
function openMenu(btn){
  let x=innerWidth-40, y=40; if(btn&&btn.getBoundingClientRect){ const r=btn.getBoundingClientRect(); if(r.width){ x=r.left+r.width/2; y=r.top+r.height/2; } }
  if(btn) btn.classList.add('hot');
  $('#menuRoot').innerHTML=`<div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Menu" style="--mx:${x}px;--my:${y}px">${menuHTML()}</div>`;
  syncSegs($('#menu'),true); updateEstbar();
  setTimeout(()=>{ const c=$('#menu .x'); try{ c&&c.focus({preventScroll:true}); }catch(e){} },300);
}
function renderMenu(){ const m=$('#menu'); if(!m) return; m.classList.add('still'); m.innerHTML=menuHTML(); syncSegs(m,true); }
function closeMenu(){ const m=$('#menu'); $$('.burger.hot').forEach(b=>b.classList.remove('hot')); if(!m) return; m.classList.remove('still'); m.classList.add('closing'); setTimeout(()=>{ if($('#menuRoot').firstChild===m) $('#menuRoot').innerHTML=''; updateEstbar(); },reduced()?0:480); }

/* ================= guided tour ================= */
const TOUR=[{r:'home',s:'.cta'},{r:'home',s:'.earn'},{r:'home',s:'.pcard'},{r:'estimate',s:'.composer'},{r:'estimate',s:'#sumCard'},{r:'any',s:'.burger'}];
let tour=null;
function visEl(sel){ return $$(sel).find(e=>{ const r=e.getBoundingClientRect(); return r.width>0&&r.height>0; })||null; }
function startTour(){
  if($('#menu')) closeMenu(); if($('#sheet .scrim')) closeSheet();
  tour={i:0,el:null};
  $('#tourRoot').innerHTML=`<div class="tour" id="tour" role="dialog" aria-modal="true"><div class="spot" id="spot"></div><div class="tip" id="tip"></div></div>`;
  showTour();
}
function showTour(){
  if(!tour) return; const st=TOUR[tour.i]; const need=st.r!=='any'&&S.route!==st.r;
  if(need) go(st.r);
  setTimeout(()=>{
    if(!tour) return; const el=visEl(st.s); if(!el){ nextTour(); return; }
    try{ el.scrollIntoView({block:'center',behavior:reduced()?'auto':'smooth'}); }catch(e){}
    setTimeout(()=>placeTour(el),reduced()?0:450);
  },need?520:80);
}
function placeTour(el){
  if(!tour) return; tour.el=el; const n=TOUR.length, i=tour.i;
  const r=el.getBoundingClientRect(), pad=8, sp=$('#spot'), tip=$('#tip'); if(!sp||!tip) return;
  const br=parseFloat(getComputedStyle(el).borderTopLeftRadius)||14;
  sp.style.top=(r.top-pad)+'px'; sp.style.left=(r.left-pad)+'px'; sp.style.width=(r.width+pad*2)+'px'; sp.style.height=(r.height+pad*2)+'px'; sp.style.borderRadius=(br+pad)+'px';
  tip.innerHTML=`<div class="in"><div class="n">${TOUR.map((x,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}<span style="margin-left:6px">${esc(t('tour_n',{i:i+1,n:n}))}</span></div>
    <h3>${esc(t('tour'+(i+1)+'_t'))}</h3><p>${esc(t('tour'+(i+1)+'_d'))}</p>
    <div class="ft"><button class="lnk" data-act="tour-skip">${esc(t('skip'))}</button><button class="btn sm press" data-act="tour-next">${esc(i===n-1?t('tour_done'):t('tour_next'))}${i===n-1?'':ic('arrow',16)}</button></div></div>`;
  tip.classList.remove('re'); reflow(tip); tip.classList.add('re');
  const W=innerWidth, H=innerHeight, tw=tip.offsetWidth||Math.min(350,W-32), th=tip.offsetHeight||190;
  let top=r.bottom+pad+14; if(top+th>H-16) top=r.top-pad-14-th; if(top<16) top=Math.max(16,H-th-16);
  const left=Math.max(16,Math.min(r.left-pad,W-tw-16));
  tip.style.top=top+'px'; tip.style.left=left+'px';
  setTimeout(()=>{ const b=$('#tip .btn'); try{ b&&b.focus({preventScroll:true}); }catch(e){} },200);
}
function nextTour(){ if(!tour) return; tour.i++; if(tour.i>=TOUR.length){ endTour(); return; } showTour(); }
function endTour(){ tour=null; S.toured=true; save(); if(S.route!=='home') setTimeout(()=>go('home',{dir:'bwd'}),200); else { const v=$('#view'); try{ v.scrollTo({top:0,behavior:reduced()?'auto':'smooth'}); }catch(e){ v.scrollTop=0; } } const el=$('#tour'); if(!el) return; el.classList.add('bye'); setTimeout(()=>{ $('#tourRoot').innerHTML=''; },reduced()?0:300); }

/* ================= events ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==='sheet-bg'){ if(e.target===el) closeSheet(); return; }
  switch(a){
    case 'go': go(el.dataset.to); break;
    case 'open': go('project',{pid:el.dataset.pid}); break;
    case 'back': go(S.from&&S.from!=='project'?S.from:'home',{back:true,dir:'bwd'}); break;
    case 'lang': case 'set-lang': case 'ob-lang': {
      const v=el.dataset.v; if(v===S.lang) break; S.lang=v; if(!S.msgLangSet) S.msgLang=v; save(); document.documentElement.lang=v;
      if(a==='ob-lang'){ obKeep(); renderOb(); break; }
      if(a==='set-lang'){ setSeg(el.closest('.seg'),v); }
      if($('#menu')) setSeg(el.closest('.seg'),v);
      renderChrome(); renderView('swap'); if($('#menu')) setTimeout(renderMenu,380);
      if(a==='set-lang'){ closeSheet(); setTimeout(shSettings,320); }
      break; }
    case 'settings': go('account'); break;
    case 'menu': openMenu(el); break;
    case 'menu-close': closeMenu(); break;
    case 'm-go': go(el.dataset.to); closeMenu(); break;
    case 'm-open': go('project',{pid:el.dataset.pid}); closeMenu(); break;
    case 'm-settings': go('account'); closeMenu(); break;
    case 'act-f': S.actFilter=el.dataset.v; setSeg(el.closest('.seg'),S.actFilter); { const v=$('#view'); const tmp=document.createElement('div'); tmp.innerHTML=vActivity(); const nl=$('#actList',tmp); $('#actList').innerHTML=nl.innerHTML; $('#actList').classList.remove('flash'); reflow($('#actList')); $('#actList').classList.add('flash'); } break;
    case 'acc-cur': S.cur=el.dataset.v; save(); setSeg(el.closest('.seg'),S.cur); { const i2=$('#acRate'); if(i2&&i2.nextElementSibling) i2.nextElementSibling.textContent=curSym()+'/'+(S.lang==='ru'?'ч':'h'); } break;
    case 'm-q-est': go('estimate'); closeMenu(); setTimeout(()=>{ const c=$('#comp'); try{ c&&c.focus(); }catch(e){} },560); break;
    case 'm-q-fb': go('project',{pid:el.dataset.pid}); closeMenu(); setTimeout(shFeedback,520); break;
    case 'm-q-np': closeMenu(); setTimeout(shNewProject,380); break;
    case 'm-cur': S.cur=el.dataset.v; save(); setSeg(el.closest('.seg'),S.cur); renderView(false); setTimeout(renderMenu,400); break;
    case 'm-tour': closeMenu(); setTimeout(startTour,420); break;
    case 'm-replay': closeMenu(); setTimeout(startOb,420); break;
    case 'm-reset': { const lg=S.lang; S=seed(lg); S.onboarded=true; S.toured=true; save(); renderChrome(); renderView('swap'); closeMenu(); toast(t('t_reset')); break; }
    case 'tour-next': nextTour(); break;
    case 'tour-skip': endTour(); break;

    case 'sheet-close': closeSheet(); break;
    case 'set-cur': S.cur=el.dataset.v; setSeg(el.closest('.seg'),S.cur); save(); break;
    case 'set-save': { S.name=$('#sName').value.trim().slice(0,40); S.rate=Math.max(100,Math.round(num($('#sRate').value,S.rate/100)*100)); save(); closeSheet(); renderChrome(); renderView('swap'); toast(t('t_saved')); break; }
    case 'set-replay': closeSheet(); setTimeout(startOb,250); break;
    case 'set-reset': { const lg=S.lang; S=seed(lg); S.onboarded=true; S.toured=true; save(); closeSheet(); renderChrome(); renderView('swap'); toast(t('t_reset')); break; }

    case 'ob-next': obKeep(); ob.i=Math.min(3,ob.i+1); ob.dir='fwd'; renderOb(); break;
    case 'ob-back': obKeep(); ob.i=Math.max(0,ob.i-1); ob.dir='bwd'; renderOb(); break;
    case 'ob-skip': obKeep(); ob.i=3; ob.dir='fwd'; renderOb(); break;
    case 'ob-cur': S.cur=el.dataset.v; save(); obKeep(); setSeg(el.closest('.seg'),S.cur); { const i=$('#obRoot .affix i'); if(i) i.textContent=curSym()+'/'+(S.lang==='ru'?'ч':'h'); const pv=$('#obPrevRate'); if(pv) pv.textContent=money(Math.round((ob.rate!=null?ob.rate:S.rate/100)*100)*3.5); } break;
    case 'ob-done': finishOb(); break;

    case 'est-add': { const ta=$('#comp'); const lines=splitLines(ta.value); if(!lines.length) break; ta.value=''; autoGrow(ta); addEstItems(lines); ta.focus(); break; }
    case 'est-ex': addEstItems([t('ex')[+el.dataset.i]]); break;
    case 'est-step': { const it=estItem(id); if(!it) break; it.mins=stepMins(it.mins,+el.dataset.d); save(); refreshItemEl(el.closest('.item'),it,it.paid,dRate(),metaHTML(it,'est')); estSum(); break; }
    case 'est-reset': { const it=estItem(id); if(!it) break; it.mins=it.sugM; save(); refreshItemEl(el.closest('.item'),it,it.paid,dRate(),metaHTML(it,'est')); estSum(); break; }
    case 'est-paid': { const it=estItem(id); if(!it) break; it.paid=el.dataset.v==='1'; save(); setSeg(el.closest('.seg'),el.dataset.v); refreshItemEl(el.closest('.item'),it,it.paid,dRate(),metaHTML(it,'est')); estSum(); break; }
    case 'est-del': { const itEl=el.closest('.item'); removeItemEl(itEl,()=>{ S.draft.items=S.draft.items.filter(i=>i.id!==id); save(); $('#estItems').innerHTML=estItemsHTML(); syncSegs($('#estItems'),true); if(!S.draft.items.length){ $('#estEx').innerHTML=exHTML(); } estSum(); }); break; }
    case 'mlang': S.msgLang=el.dataset.v; S.msgLangSet=true; save(); setSeg(el.closest('.seg'),S.msgLang); estSum(); break;
    case 'est-copy': { if(!S.draft.items.length){ toast(t('msg_empty')); break; } copyText(estMsgText()); copiedBtn($('#copyBtn')); copiedBtn($('#ebCopy')); toast(t('t_copied')); break; }
    case 'est-save': { if(!S.draft.items.length){ toast(t('empty')); break; } const c=estCalc(); const e1={id:uid(),at:Date.now(),client:S.draft.client.trim(),mins:c.mins,total:c.total,count:c.paid.length,status:'sent'};
      S.estimates.unshift(e1); S.feed.push({at:e1.at,type:'estimate',p:{c:e1.client||t('anon'),sum:e1.total}}); save();
      const h=$('#hist'); if(h){ if(!h.classList.contains('hist')){ h.outerHTML=`<div class="sec"><h2 class="h2">${esc(t('hist'))}</h2></div><div class="hist" id="hist"></div>`; } $('#hist').innerHTML=histHTML(); const f=$('#hist .hrow'); if(f) f.classList.add('new'); }
      toast(t('saved')); break; }
    case 'est-clear': { const its=$$('#estItems .item'); its.forEach((x,k)=>{ x.style.animationDelay=(k*40)+'ms'; x.classList.add('out'); }); setTimeout(()=>{ S.draft.items=[]; S.draft.client=''; save(); renderView(false); },reduced()?0:260+its.length*40); break; }
    case 'est-agree': { const es=S.estimates.find(x=>x.id===id); if(!es) break; es.status='agreed'; S.ledger.push({id:uid(),at:Date.now(),amount:es.total,src:es.client}); S.feed.push({at:Date.now(),type:'agreed',p:{c:es.client||t('anon'),sum:es.total}}); save();
      const row=el.closest('.hrow'); $('#hist').innerHTML=histHTML(); const nr=$(`#hist .hrow[data-id="${id}"]`); if(nr){ nr.classList.add('glow'); const c=$('.chip',nr); if(c) c.classList.add('pop'); }
      toast(t('added_earn')); break; }

    case 'pj-step': case 'pj-reset': { const x=pjChange(id); if(!x.c) break; x.c.mins=a==='pj-step'?stepMins(x.c.mins,+el.dataset.d):x.c.sugM; save(); refreshItemEl(el.closest('.item'),x.c,x.c.extra,x.p.rate,metaHTML(x.c,'pj',reasonText(x.p,x.c,x.r))); refreshTracker(x.p); break; }
    case 'pj-paid': { const x=pjChange(id); if(!x.c) break; x.c.extra=el.dataset.v==='1'; x.c.reason='manual'; if(!x.c.extra) x.c.approved=false; save(); setSeg(el.closest('.seg'),el.dataset.v); refreshItemEl(el.closest('.item'),x.c,x.c.extra,x.p.rate,metaHTML(x.c,'pj',reasonText(x.p,x.c,x.r))); refreshTracker(x.p); break; }
    case 'pj-del': { const x=pjChange(id); if(!x.c) break; removeItemEl(el.closest('.item'),()=>{ x.r.changes=x.r.changes.filter(c=>c.id!==id); save(); $('#pjItems').innerHTML=pjItemsHTML(x.p); syncSegs($('#pjItems'),true); refreshTracker(x.p); }); break; }
    case 'pj-feedback': shFeedback(); break;
    case 'fb-save': { const p=P(S.pid); const lines=splitLines($('#fbText').value); if(!lines.length){ $('#fbText').focus(); break; }
      let r=curRound(p); if(r.status!=='collecting'){ r={n:r.n+1,status:'collecting',at:Date.now(),changes:[]}; p.rounds.push(r); }
      lines.forEach(l=>{ const s=suggest(l); const cl=classify(p,r,s); const c={id:uid(),text:l,mins:s.m,sugM:s.m,kind:s.k,extra:cl.extra,reason:cl.reason,approved:false}; r.changes.push(c); fresh.add(c.id); });
      p.events.push({at:Date.now(),type:'feedback',p:{n:r.n,k:lines.length}}); save(); closeSheet();
      setTimeout(()=>{ renderView(false); fresh.clear(); const it=$('#pjItems'); if(it) it.scrollIntoView&&it.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'start'}); toast(t('t_fb',{k:lines.length,n:r.n})); },200); break; }
    case 'pj-reply': shReply(); break;
    case 'rp-lang': { S.msgLang=el.dataset.v; S.msgLangSet=true; save(); setSeg(el.closest('.seg'),S.msgLang); const p=P(S.pid); const m=$('#rpMsg'); m.textContent=buildMsg({lang:S.msgLang,client:p.client,name:S.name.trim(),items:pjItemsForMsg(p),rate:p.rate,cur:S.cur}); m.classList.remove('flash'); reflow(m); m.classList.add('flash'); break; }
    case 'rp-copy': copyText($('#rpMsg').textContent); copiedBtn($('#rpCopy')); toast(t('t_copied')); break;
    case 'pj-client': shClient(); break;
    case 'cl-check': { el.classList.toggle('on'); el.setAttribute('aria-checked',el.classList.contains('on')); clUpdate(); break; }
    case 'cl-approve': { const x=clSel(); const nm=$('#clName').value.trim(); if(!x.ids.length||!nm) break; const now=Date.now();
      x.p.rounds.forEach(r=>r.changes.forEach(c=>{ if(x.ids.includes(c.id)){ c.approved=true; c.approvedBy=nm; c.approvedAt=now; } }));
      x.p.events.push({at:now,type:'approved',p:{c:nm,sum:x.sum}}); S.ledger.push({id:uid(),at:now,amount:x.sum,src:x.p.name}); save();
      let tm=''; try{ tm=new Intl.DateTimeFormat(LOC[S.lang],{hour:'2-digit',minute:'2-digit'}).format(new Date(now)); }catch(e){}
      $('#portal').innerHTML=`<div class="thanks"><span class="circ"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path pathLength="30" d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>${esc(t('cl_thx'))}</b><span>${esc(t('cl_note',{name:nm,time:tm}))}</span><span class="tnum" style="font-family:var(--sans);font-weight:700;font-size:34px;color:#111">${esc(money(x.sum))}</span></div>
        <button class="btn wide press" data-act="cl-done">${esc(t('done'))}</button>`;
      break; }
    case 'cl-done': { closeSheet(); setTimeout(()=>{ const p=P(S.pid); $('#pjItems').innerHTML=pjItemsHTML(p); syncSegs($('#pjItems'),true); $$('#pjItems .item.is-ok').forEach(x=>x.classList.add('glow')); refreshTracker(p); $('#pjLog').innerHTML=logHTML(p); const f=$('#pjLog .fi'); if(f) f.classList.add('new'); },300); break; }
    case 'pj-deliver': { const p=P(S.pid); const r=curRound(p); if(r.status!=='collecting') break; r.status='delivered'; r.doneAt=Date.now(); p.events.push({at:r.doneAt,type:'delivered',p:{n:r.n}}); save(); renderView(false); toast(t('t_delivered',{n:r.n})); break; }
    case 'pj-edit': shAgreement(); break;
    case 'ag-save': { const p=P(S.pid); p.fee=Math.round(num($('#agFee').value,p.fee/100)*100); p.rate=Math.max(100,Math.round(num($('#agRate').value,p.rate/100)*100)); p.included=Math.max(0,Math.min(20,Math.round(num($('#agIncl').value,p.included))));
      p.deliverables=$('#agDeliv').value.split(',').map(s=>s.trim()).filter(Boolean); reclassify(p); p.events.push({at:Date.now(),type:'agreement'}); save(); closeSheet(); setTimeout(()=>{ renderView(false); toast(t('t_ag')); },200); break; }
    case 'pj-copylog': copyText(logText(P(S.pid))); toast(t('log_copied')); break;
    case 'pj-round': { const rp=el.closest('.rp'); const p=P(S.pid); const idx=$$('.rp').indexOf(rp); const rr=p.rounds.slice(0,-1).reverse()[idx];
      if(rp.classList.toggle('open')){ const ul=document.createElement('ul'); ul.innerHTML=rr.changes.map(c=>`<li>${esc(Lx(c.text))} <span style="color:var(--dim)">(${esc(dur(c.mins))})</span></li>`).join(''); rp.appendChild(ul); } else { const ul=$('ul',rp); if(ul) ul.remove(); } break; }
    case 'np': shNewProject(); break;
    case 'np-save': { const name=$('#npName').value.trim(); if(!name){ $('#npName').focus(); break; }
      const cols=Object.keys(TC); const p={id:'p'+uid(),name:name.slice(0,48),client:$('#npClient').value.trim()||'—',color:cols[S.projects.length%cols.length],fee:Math.round(num($('#npFee').value,800)*100),rate:Math.max(100,Math.round(num($('#npRate').value,S.rate/100)*100)),included:Math.max(0,Math.min(20,Math.round(num($('#npIncl').value,2)))),created:Date.now(),
        deliverables:$('#npDeliv').value.split(',').map(s=>s.trim()).filter(Boolean),rounds:[{n:1,status:'collecting',at:Date.now(),changes:[]}],events:[{at:Date.now(),type:'created'}]};
      S.projects.unshift(p); save(); closeSheet(); setTimeout(()=>{ go('project',{pid:p.id}); toast(t('t_np')); },220); break; }
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&tour){ endTour(); return; }
  if(e.key==='Escape'&&$('#menu')){ closeMenu(); return; }
  if(e.key==='Escape'&&$('#sheet .scrim')){ closeSheet(); return; }
  if(e.target.id==='comp'&&e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); const b=$('#compAdd'); if(b&&!b.disabled) b.click(); }
  if(e.target.classList&&e.target.classList.contains('pl')&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='comp') autoGrow(e.target);
  else if(id==='eClient'){ S.draft.client=e.target.value.slice(0,40); save(); estSum(); }
  else if(id==='eRate'){ const v=num(e.target.value,null); if(v!=null&&v>0){ S.draft.rate=Math.round(v*100); save(); $$('#estItems .item').forEach(el=>{ const it=estItem(el.dataset.id); if(it){ const p=$('.it-price',el); if(it.paid) p.textContent=money(price(it.mins,dRate())); } }); estSum(); } }
  else if(id==='clName'){ clUpdate(); }
  else if(id==='acName'){ S.name=e.target.value.slice(0,40); save(); const b=$('.side .me b'); if(b) b.textContent=dispName()||t('you'); const a=$('.acc-id b'); if(a) a.textContent=acct.name||S.name||t('you'); }
  else if(id==='acRate'){ const v=num(e.target.value,null); if(v!=null&&v>0){ S.rate=Math.round(v*100); save(); } }
  else if(id==='obName'){ ob.name=e.target.value; const pv=$('#obPrev'); if(pv){ const f=ob.name.trim().split(/\s+/)[0]; pv.textContent=f?', '+f:''; } }
  else if(id==='obRate'){ ob.rate=num(e.target.value,S.rate/100); const pv=$('#obPrevRate'); if(pv) pv.textContent=money(Math.round(ob.rate*100)*3.5); }
});
document.addEventListener('paste',e=>{
  if(e.target.id!=='comp') return; const txt=(e.clipboardData||window.clipboardData).getData('text'); if(!txt||!/\n/.test(txt.trim())) return;
  e.preventDefault(); const lines=splitLines(txt); if(lines.length) addEstItems(lines);
});
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ syncSegs(document,true); if(tour&&tour.el) placeTour(tour.el); },120); });

/* ================= boot ================= */
document.documentElement.lang=S.lang;
S.sheetOpen=false;
if(S.route==='project'&&!P(S.pid)) S.route='home';
renderChrome();
if(!S.onboarded){ S.route='home'; renderView(false); startOb(); } else renderView(false);
connect();
(function(){
  const sp=document.getElementById('splash'); if(!sp) return; let gone=false;
  function hide(){ if(gone) return; gone=true; sp.classList.add('leave'); if(S.onboarded){ renderView('swap'); if(!S.toured) setTimeout(startTour,reduced()?300:1600); } else renderOb(); setTimeout(()=>sp.remove(),520); }
  sp.addEventListener('click',hide); setTimeout(hide,reduced()?400:2300);
})();
if('serviceWorker' in navigator && location.protocol!=='file:'){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
